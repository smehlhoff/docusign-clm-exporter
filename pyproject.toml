[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "clm-exporter"
version = "1.0.0"
description = "Resumable, metadata-based Docusign CLM SFTP PDF exporter"
requires-python = ">=3.12"
dependencies = ["paramiko==4.0.0", "tqdm==4.67.1"]

[project.scripts]
clm-exporter = "clm_exporter.cli:main"

[tool.setuptools.packages.find]
include = ["clm_exporter*"]
