[sftp]
host = "your-clm-sftp-host"
port = 22
username = "your-sftp-username"
private_key_path = "~/.ssh/clm_rsa"
known_hosts_path = "~/.ssh/known_hosts"
remote_root = "/your-remote-root"

[local]
working_directory = "~/clm-export"
export_folder_name = "CLM-export"

[limits]
max_staged_bytes = 350000000000
min_free_bytes = 50000000000

[transfer]
max_attempts = 3
connect_timeout_seconds = 30
read_timeout_seconds = 60
keepalive_seconds = 30
chunk_bytes = 1048576
